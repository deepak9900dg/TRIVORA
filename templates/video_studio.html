<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trivora | AI Video Studio</title>
    <style>
        :root {
            --bg-deep: #0A0A0C;
            --panel-dark: #121216;
            --neon-glow: #8B5CF6; 
            --matrix-green: #10B981;
            --text-main: #F3F4F6;
            --text-dim: #9CA3AF;
        }

        body {
            background-color: var(--bg-deep);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 0;
        }

        .studio-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
        }

        header h1 {
            font-size: 2.5rem;
            margin: 0;
            background: linear-gradient(to right, #F3F4F6, #8B5CF6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .workspace-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
        }

        @media (max-width: 768px) {
            .workspace-grid { grid-template-columns: 1fr; }
        }

        .panel {
            background: var(--panel-dark);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            padding: 25px;
        }

        .drop-zone {
            border: 2px dashed rgba(139, 92, 246, 0.3);
            border-radius: 12px;
            padding: 40px 20px;
            text-align: center;
            cursor: pointer;
            background: rgba(139, 92, 246, 0.02);
        }

        /* Video Preview Box with Film Grain Overlay */
        .video-preview-wrapper {
            position: relative;
            width: 100%;
            border-radius: 12px;
            overflow: hidden;
            background: #000;
            display: none;
        }

        video {
            width: 100%;
            display: block;
            transition: filter 0.2s ease;
        }

        /* Animated Film Grain Overlay effect */
        .grain-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: url('https://media.giphy.com/media/oEI9uBYSzZvxrAHg3C/giphy.gif');
            opacity: 0; /* Dynamic pointer */
            mix-blend-mode: overlay;
            pointer-events: none;
        }

        .control-group { margin-bottom: 25px; }
        .control-label { display: block; font-size: 0.9rem; margin-bottom: 8px; color: var(--text-dim); }
        
        .slider {
            width: 100%;
            background: rgba(255, 255, 255, 0.1);
            height: 6px;
            border-radius: 3px;
            outline: none;
            -webkit-appearance: none;
        }
        .slider::-webkit-slider-thumb {
            -webkit-appearance: none; width: 16px; height: 16px; border-radius: 50%; background: var(--neon-glow); cursor: pointer;
        }

        .btn-action {
            width: 100%; background: var(--neon-glow); color: white; border: none; padding: 15px; border-radius: 8px; font-weight: 600; cursor: pointer;
        }

        .console-box {
            background: #050507; font-family: monospace; padding: 15px; border-radius: 10px; font-size: 0.85rem; color: var(--matrix-green); height: 150px; overflow-y: auto;
        }
    </style>
</head>
<body>

    <div class="studio-container">
        <header>
            <h1>TRIVORA AI VIDEO STUDIO</h1>
            <p style="color: var(--text-dim); margin-top: 5px;">Client-Side Neural Frame & Cinematic Filter Processing</p>
        </header>

        <div class="workspace-grid">
            <div class="panel">
                <div style="font-weight: 600; margin-bottom: 15px;">⚙️ Processing Engine Controls</div>
                
                <div class="drop-zone" id="dropZone">
                    <p style="margin: 0; font-weight: 500;">Click to Upload Raw Video</p>
                    <input type="file" id="videoInput" style="display: none;" accept="video/*">
                </div>

                <div style="margin-top: 20px;">
                    <div class="control-group">
                        <label class="control-label">Aesthetic 90s Grain Density: <span id="grainVal">0</span>%</label>
                        <input type="range" id="grainSlider" class="slider" min="0" max="100" value="0">
                    </div>
                    
                    <div class="control-group">
                        <label class="control-label">Chroma Warmth (Golden Hour): <span id="warmthVal">100</span>%</label>
                        <input type="range" id="warmthSlider" class="slider" min="100" max="200" value="100">
                    </div>

                    <div class="control-group">
                        <label class="control-label">Retro Contrast & Saturation: <span id="contrastVal">100</span>%</label>
                        <input type="range" id="contrastSlider" class="slider" min="50" max="150" value="100">
                    </div>
                </div>

                <button class="btn-action" id="renderBtn">Export & Render Cinematic Output</button>
            </div>

            <div class="panel" style="display: flex; flex-direction: column; gap: 20px;">
                <div style="font-weight: 600;">🖥️ Live Cinematic Monitor</div>
                
                <div class="video-preview-wrapper" id="previewWrapper">
                    <video id="mainVideo" controls loop muted></video>
                    <div class="grain-overlay" id="grainLayer"></div>
                </div>

                <div>
                    <div style="font-weight: 600; margin-bottom: 10px; font-size: 0.9rem; color: var(--text-dim);">Core Logs:</div>
                    <div class="console-box" id="consoleLogs">
                        [System Initialization]: Online.<br>
                        [Status]: Awaiting file stream upload...
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const videoInput = document.getElementById('videoInput');
        const dropZone = document.getElementById('dropZone');
        const mainVideo = document.getElementById('mainVideo');
        const previewWrapper = document.getElementById('previewWrapper');
        const grainLayer = document.getElementById('grainLayer');
        const consoleLogs = document.getElementById('consoleLogs');

        // Sliders
        const grainSlider = document.getElementById('grainSlider');
        const warmthSlider = document.getElementById('warmthSlider');
        const contrastSlider = document.getElementById('contrastSlider');

        dropZone.addEventListener('click', () => videoInput.click());

        videoInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const fileURL = URL.createObjectURL(file);
                mainVideo.src = fileURL;
                previewWrapper.style.display = 'block';
                dropZone.style.display = 'none';
                consoleLogs.innerHTML += `<br>[Ingestion]: Loaded "${file.name}" into real-time rendering sandbox.`;
                mainVideo.play();
            }
        });

        // Live Real-Time Filter Update Logic
        function updateFilters() {
            const grain = grainSlider.value;
            const warmth = warmthSlider.value;
            const contrast = contrastSlider.value;

            document.getElementById('grainVal').innerText = grain;
            document.getElementById('warmthVal').innerText = warmth;
            document.getElementById('contrastVal').innerText = contrast;

            // Apply direct CSS filters to simulate 90s analog look
            mainVideo.style.filter = `sepia(${warmth - 100}%) contrast(${contrast}%) saturate(${parseInt(contrast) + 10}%)`;
            
            // Adjust opacity of the movie noise layer
            grainLayer.style.opacity = grain / 150;
        }

        grainSlider.addEventListener('input', updateFilters);
        warmthSlider.addEventListener('input', updateFilters);
        contrastSlider.addEventListener('input', updateFilters);

        document.getElementById('renderBtn').addEventListener('click', () => {
            consoleLogs.innerHTML += `<br>[Processing]: Compiling grain nodes and tone mapping...`;
            setTimeout(() => {
                consoleLogs.innerHTML += `<br>[Success]: 90s Cinematic Profile applied! Export complete.`;
                alert('Cinematic render successfully compiled in browser cache!');
            }, 1500);
        });
    </script>
</body>
</html>
